<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ŞükrüÖzolgay - Secure AI Agent Factory</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --accent-color: #d81b60;
            --accent-hover: #b7154f;
            --agent-active: #00e676;
            --text-main: #ffffff;
            --text-sub: #a0a0ab;
            --border-color: #2a2a32;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Güvenlik Kilit Ekranı */
        #securityOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(15, 15, 18, 0.98);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            width: 340px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .auth-box h3 { margin-top: 0; color: var(--accent-color); }
        .auth-box input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid var(--border-color); background: #0f0f12; color: #fff; box-sizing: border-box; }
        .auth-box button { width: 100%; padding: 10px; background: var(--accent-color); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .layout-container {
            width: 100%;
            max-width: 1100px;
            height: 90vh;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            overflow: hidden;
            filter: blur(5px);
            pointer-events: none;
            transition: filter 0.3s ease;
        }

        .layout-container.unlocked {
            filter: blur(0);
            pointer-events: auto;
        }

        .sidebar {
            width: 260px;
            background-color: #121215;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h3 { margin: 0; font-size: 0.95rem; color: var(--text-sub); }

        .btn-new-project {
            background-color: var(--accent-color);
            color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold;
        }

        .project-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }

        .project-item {
            padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; color: var(--text-sub); border: 1px solid transparent; transition: all 0.2s;
        }

        .project-item.active {
            background-color: rgba(216, 27, 96, 0.15); border-color: var(--accent-color); color: var(--text-main); font-weight: 600;
        }

        .chat-main { flex: 1; display: flex; flex-direction: column; background-color: var(--card-bg); }

        .header {
            padding: 16px 24px; background-color: rgba(255, 255, 255, 0.02); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;
        }

        .header h2 { margin: 0; font-size: 1.25rem; color: var(--accent-color); }

        .header-actions { display: flex; gap: 10px; align-items: center; }

        .header-actions button {
            background: none; border: 1px solid var(--border-color); color: var(--text-sub); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
        }

        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }

        .message { max-width: 85%; padding: 12px 16px; border-radius: 10px; line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; }

        .user-message { align-self: flex-end; background-color: var(--accent-color); color: #fff; }

        .ai-message { align-self: flex-start; background-color: #222228; border: 1px solid var(--border-color); color: var(--text-main); }

        .agent-status {
            align-self: center; background: rgba(0, 230, 118, 0.1); border: 1px solid var(--agent-active); color: var(--agent-active); font-size: 0.85rem; padding: 6px 14px; border-radius: 20px; animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        .input-container { padding: 16px; border-top: 1px solid var(--border-color); background-color: rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 10px; }

        .input-row { display: flex; gap: 10px; }

        input[type="text"] {
            flex: 1; background-color: #0f0f12; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 16px; color: #fff; font-size: 0.95rem; outline: none;
        }

        button.btn-send { background-color: var(--accent-color); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button.btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

        .file-upload-btn { background-color: #222228; border: 1px solid var(--border-color); color: var(--text-sub); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

        #file-input { display: none; }
        .preview-area { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--accent-color); }
        .memory-badge { font-size: 0.8rem; color: var(--text-sub); background: #222228; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

<!-- Güvenlik Duvarı Ekrani -->
<div id="securityOverlay">
    <div class="auth-box">
        <h3>🔒 Güvenlik Doğrulaması</h3>
        <p style="font-size: 0.85rem; color: #a0a0ab;">Sisteme erişmek için PIN kodunu ve bot doğrulamasını giriniz.</p>
        <input type="password" id="accessPin" placeholder="Erişim Şifresi">
        <div style="margin: 10px 0; text-align: left; font-size: 0.85rem;">
            <label id="captchaQuestion" style="color: #00e676;"></label>
            <input type="number" id="captchaAnswer" placeholder="Cevap">
        </div>
        <button onclick="verifyAccess()">Sisteme Giriş Yap</button>
        <p id="authError" style="color: #ff5252; font-size: 0.8rem; display: none; margin-top: 8px;"></p>
    </div>
</div>

<div class="layout-container" id="mainLayout">
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>Ajan Projeleri</h3>
            <button class="btn-new-project" onclick="createNewProject()">+ Yeni Proje</button>
        </div>
        <div class="project-list" id="projectList"></div>
    </div>

    <div class="chat-main">
        <div class="header">
            <h2 id="activeProjectTitle">ŞükrüÖzolgay - AI Agent</h2>
            <div class="header-actions">
                <span class="memory-badge" id="memory-count">Global Hafıza: 0 Bilgi</span>
                <button onclick="setApiKey()">🔑 API Key Gir</button>
                <button onclick="clearGlobalMemory()">🗑️ Hafızayı Sıfırla</button>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message ai-message">🛡️ Güvenli Otonom Ajan Modu Aktif. Sistem koruma altındadır. Görevi verin, canlı internet taraması yaparak çalışacaktır.</div>
        </div>

        <div class="input-container">
            <div class="preview-area" id="previewArea" style="display: none;">
                <span>📷 Görsel: <strong id="fileName"></strong></span>
                <button onclick="cancelImage()" style="background:none; border:none; color:red; cursor:pointer;">✖</button>
            </div>
            <div class="input-row">
                <label class="file-upload-btn">
                    📁 Görsel
                    <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect(event)">
                </label>
                <input type="text" id="userInput" placeholder="Görev tanımını yazın..." onkeypress="handleKeyPress(event)">
                <button class="btn-send" id="btnSend" onclick="startAgentWorkflow()">Ajanı Çalıştır</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- GÜVENLİK AYARLARI ---
    const SYSTEM_PIN = "Sukru2026!"; // İsteğinize göre şifrenizi değiştirebilirsiniz
    let num1 = Math.floor(Math.random() * 10) + 1;
    let num2 = Math.floor(Math.random() * 10) + 1;
    let captchaCorrectAnswer = num1 + num2;
    let lastExecutionTime = 0;
    const RATE_LIMIT_COOLDOWN = 5000; // İstekler arası 5 saniye güvenlik beklemesi

    document.getElementById("captchaQuestion").innerText = `Bot Doğrulaması: ${num1} + ${num2} = ?`;

    function verifyAccess() {
        const pinInput = document.getElementById("accessPin").value;
        const captchaInput = parseInt(document.getElementById("captchaAnswer").value);
        const errorElement = document.getElementById("authError");

        if (pinInput !== SYSTEM_PIN) {
            errorElement.innerText = "Hatalı Erişim Şifresi!";
            errorElement.style.display = "block";
            return;
        }

        if (captchaInput !== captchaCorrectAnswer) {
            errorElement.innerText = "Hatalı Bot Doğrulaması!";
            errorElement.style.display = "block";
            return;
        }

        // Başarılı Giriş
        document.getElementById("securityOverlay").style.display = "none";
        document.getElementById("mainLayout").classList.add("unlocked");
    }

    let selectedImageBase64 = null;
    let selectedImageType = null;

    function getApiKey() { return (localStorage.getItem("gemini_api_key") || "").trim(); }

    function setApiKey() {
        const key = prompt("Google Gemini API Key giriniz:", getApiKey());
        if (key !== null) {
            localStorage.setItem("gemini_api_key", key.trim());
            alert("API Key tarayıcı hafızasına güvenle kaydedildi!");
        }
    }

    function getProjects() {
        let projects = JSON.parse(localStorage.getItem("sukru_ai_projects"));
        if (!projects) {
            projects = { "Varsayılan Proje": [] };
            localStorage.setItem("sukru_ai_projects", JSON.stringify(projects));
        }
        return projects;
    }

    function saveProjects(projects) { localStorage.setItem("sukru_ai_projects", JSON.stringify(projects)); }
    function getActiveProject() { return localStorage.getItem("sukru_active_project") || "Varsayılan Proje"; }

    function setActiveProject(projectName) {
        localStorage.setItem("sukru_active_project", projectName);
        renderProjectsList();
        loadChatHistory();
    }

    function getGlobalMemory() { return JSON.parse(localStorage.getItem("sukru_global_knowledge")) || []; }
    function saveGlobalMemory(data) {
        const memory = getGlobalMemory();
        memory.push(data);
        localStorage.setItem("sukru_global_knowledge", JSON.stringify(memory));
        updateMemoryCount();
    }

    function clearGlobalMemory() {
        if(confirm("Tüm ortak hafıza silinecek. Emin misiniz?")) {
            localStorage.removeItem("sukru_global_knowledge");
            updateMemoryCount();
        }
    }

    function updateMemoryCount() {
        document.getElementById("memory-count").innerText = `Global Hafıza: ${getGlobalMemory().length} Bilgi`;
    }

    function renderProjectsList() {
        const projects = getProjects();
        const activeProj = getActiveProject();
        const listContainer = document.getElementById("projectList");
        listContainer.innerHTML = "";

        for (const projName in projects) {
            const item = document.createElement("div");
            item.className = `project-item ${projName === activeProj ? 'active' : ''}`;
            item.innerHTML = `<span>📁 ${projName}</span>`;
            item.onclick = () => setActiveProject(projName);
            listContainer.appendChild(item);
        }
        document.getElementById("activeProjectTitle").innerText = `Proje: ${activeProj}`;
    }

    function loadChatHistory() {
        const projects = getProjects();
        const activeProj = getActiveProject();
        const chatBox = document.getElementById("chatBox");
        chatBox.innerHTML = "";
        const history = projects[activeProj] || [];
        if (history.length === 0) {
            addMessageToDOM("ai", `"${activeProj}" projesi için Otonom Ajan hazır.`);
        } else {
            history.forEach(msg => addMessageToDOM(msg.sender, msg.text));
        }
    }

    function createNewProject() {
        const projName = prompt("Yeni proje adını giriniz:");
        if (!projName) return;
        const projects = getProjects();
        if (projects[projName]) return alert("Bu isimde bir proje var!");
        projects[projName] = [];
        saveProjects(projects);
        setActiveProject(projName);
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        selectedImageType = file.type;
        const reader = new FileReader();
        reader.onload = function(e) {
            selectedImageBase64 = e.target.result.split(',')[1];
            document.getElementById("fileName").innerText = file.name;
            document.getElementById("previewArea").style.display = "flex";
        };
        reader.readAsDataURL(file);
    }

    function cancelImage() {
        selectedImageBase64 = null;
        selectedImageType = null;
        document.getElementById("file-input").value = "";
        document.getElementById("previewArea").style.display = "none";
    }

    function handleKeyPress(event) { if (event.key === "Enter") startAgentWorkflow(); }

    function addMessageToDOM(sender, text) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender === 'user' ? 'user-message' : 'ai-message'}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
    }

    function addAgentStatus(text) {
        const chatBox = document.getElementById("chatBox");
        const statusDiv = document.createElement("div");
        statusDiv.className = "agent-status";
        statusDiv.innerText = text;
        chatBox.appendChild(statusDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return statusDiv;
    }

    function saveMessageToActiveProject(sender, text) {
        const projects = getProjects();
        const activeProj = getActiveProject();
        if (!projects[activeProj]) projects[activeProj] = [];
        projects[activeProj].push({ sender, text });
        saveProjects(projects);
    }

    async function callGeminiAPIWithSearch(systemPrompt, userParts, apiKey) {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                systemInstruction: { parts: [{ text: systemPrompt }] },
                contents: [{ role: "user", parts: userParts }],
                tools: [{ googleSearch: {} }]
            })
        });
        return await response.json();
    }

    async function startAgentWorkflow() {
        const now = Date.now();
        if (now - lastExecutionTime < RATE_LIMIT_COOLDOWN) {
            alert("Lütfen iki istek arasında 5 saniye bekleyin (Bot Koruması).");
            return;
        }

        const inputField = document.getElementById("userInput");
        const userTask = inputField.value.trim();
        const apiKey = getApiKey();
        const btnSend = document.getElementById("btnSend");

        if (!apiKey) return alert("Lütfen önce API Key tanımlayın!");
        if (!userTask && !selectedImageBase64) return;

        lastExecutionTime = now;
        btnSend.disabled = true;

        addMessageToDOM("user", userTask || "[Görsel Ajan Analizine Gönderildi]");
        saveMessageToActiveProject("user", userTask);
        inputField.value = "";

        const currentImage = selectedImageBase64;
        const currentImageType = selectedImageType;
        cancelImage();

        const activeProj = getActiveProject();
        const globalMemory = JSON.stringify(getGlobalMemory());

        let statusNode = addAgentStatus("🌐 Adım 1: Ajan canlı internet araştırması yapıyor...");

        try {
            const systemPrompt1 = `Sen ŞükrüÖzolgay - AI Factory Canlı Araştırmacı Ajanısın. Görev: "${userTask}". Aktif Proje: "${activeProj}". Global Hafıza: ${globalMemory}. Google Search kullanarak güncel veriler topla.`;
            let parts1 = [];
            if (currentImage) parts1.push({ inline_data: { mime_type: currentImageType, data: currentImage } });
            parts1.push({ text: userTask || "Görseli incele ve canlı web araması yap." });

            const data1 = await callGeminiAPIWithSearch(systemPrompt1, parts1, apiKey);
            let firstDraft = data1.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!firstDraft) throw new Error(data1.error?.message || "İlk veri toplama başarısız.");

            statusNode.innerText = "🔍 Adım 2: Ajan verileri denetliyor ve doğruluyor...";

            const systemPrompt2 = `Sen sert bir Kalite Kontrolörsün. İncele ve doğrula: "${firstDraft}"`;
            const data2 = await callGeminiAPIWithSearch(systemPrompt2, [{ text: "İnternet verilerini doğrula ve son raporu ver." }], apiKey);
            let finalOutput = data2.candidates?.[0]?.content?.parts?.[0]?.text || firstDraft;

            statusNode.remove();
            addMessageToDOM("ai", `🌐✅ [Ajan İşi Tamamladı]\n\n${finalOutput}`);
            saveMessageToActiveProject("ai", finalOutput);

        } catch (error) {
            if (statusNode) statusNode.remove();
            addMessageToDOM("ai", `⚠️ Ajan İşlem Hatası: ${error.message}`);
        } finally {
            btnSend.disabled = false;
        }
    }

    renderProjectsList();
    loadChatHistory();
    updateMemoryCount();
</script>

</body>
</html>
