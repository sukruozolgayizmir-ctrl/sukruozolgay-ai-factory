<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ŞükrüÖzolgay - AI Projects</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --accent-color: #d81b60;
            --accent-hover: #b7154f;
            --text-main: #ffffff;
            --text-sub: #a0a0ab;
            --border-color: #2a2a32;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .modal-overlay {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .header {
            padding: 16px 24px;
            background-color: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--accent-color);
        }

        .header-actions button {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .header-actions button:hover {
            color: var(--text-main);
            border-color: var(--accent-color);
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--accent-color);
            color: #fff;
        }

        .ai-message {
            align-self: flex-start;
            background-color: #222228;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .input-container {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            background-color: rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #0f0f12;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button.btn-send {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.btn-send:hover {
            background-color: var(--accent-hover);
        }

        .file-upload-btn {
            background-color: #222228;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .file-upload-btn:hover {
            border-color: var(--accent-color);
            color: #fff;
        }

        #file-input {
            display: none;
        }

        .preview-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--accent-color);
        }

        .memory-badge {
            font-size: 0.8rem;
            color: var(--text-sub);
            background: #222228;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="modal-overlay">
    <div class="header">
        <h2>ŞükrüÖzolgay - AI Projects</h2>
        <div class="header-actions">
            <span class="memory-badge" id="memory-count">Hafıza: 0 Bilgi</span>
            <button onclick="setApiKey()">🔑 API Key Gir</button>
            <button onclick="clearMemory()">🗑️ Hafızayı Temizle</button>
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message ai-message">Merhaba! Ben ŞükrüÖzolgay AI Asistanı. Görsel yükleyerek hafızama bilgi ekleyebilir veya bana istediğin soruları sorabilirsin.</div>
    </div>

    <div class="input-container">
        <div class="preview-area" id="previewArea" style="display: none;">
            <span>📷 Seçilen Görsel: <strong id="fileName"></strong></span>
            <button onclick="cancelImage()" style="background:none; border:none; color:red; cursor:pointer;">✖</button>
        </div>
        <div class="input-row">
            <label class="file-upload-btn">
                📁 Görsel Yükle
                <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect(event)">
            </label>
            <input type="text" id="userInput" placeholder="Mesajınızı yazın veya görsel hakkında soru sorun..." onkeypress="handleKeyPress(event)">
            <button class="btn-send" onclick="sendMessage()">Gönder / Araştır</button>
        </div>
    </div>
</div>

<script>
    let selectedImageBase64 = null;
    let selectedImageType = null;

    // LocalStorage Hazırlığı
    function getApiKey() {
        return localStorage.getItem("gemini_api_key") || "";
    }

    function setApiKey() {
        const currentKey = getApiKey();
        const key = prompt("Google Gemini API Key giriniz:", currentKey);
        if (key !== null) {
            localStorage.setItem("gemini_api_key", key.trim());
            alert("API Key kaydedildi!");
        }
    }

    function getMemory() {
        return JSON.parse(localStorage.getItem("ai_knowledge_base")) || [];
    }

    function saveMemory(data) {
        const memory = getMemory();
        memory.push(data);
        localStorage.setItem("ai_knowledge_base", JSON.stringify(memory));
        updateMemoryCount();
    }

    function clearMemory() {
        if(confirm("Tüm yerel hafıza silinecek. Emin misiniz?")) {
            localStorage.removeItem("ai_knowledge_base");
            updateMemoryCount();
            addMessage("ai", "Hafıza tamamen temizlendi.");
        }
    }

    function updateMemoryCount() {
        const count = getMemory().length;
        document.getElementById("memory-count").innerText = `Hafıza: ${count} Bilgi`;
    }

    // Görsel Seçimi
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        selectedImageType = file.type;
        const reader = new FileReader();
        reader.onload = function(e) {
            selectedImageBase64 = e.target.result.split(',')[1];
            document.getElementById("fileName").innerText = file.name;
            document.getElementById("previewArea").style.display = "flex";
        };
        reader.readAsDataURL(file);
    }

    function cancelImage() {
        selectedImageBase64 = null;
        selectedImageType = null;
        document.getElementById("file-input").value = "";
        document.getElementById("previewArea").style.display = "none";
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }

    function addMessage(sender, text) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender === 'user' ? 'user-message' : 'ai-message'}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const promptText = inputField.value.trim();
        const apiKey = getApiKey();

        if (!apiKey) {
            alert("Lütfen önce 'API Key Gir' butonuna tıklayarak Gemini API Key'inizi tanımlayın!");
            return;
        }

        if (!promptText && !selectedImageBase64) return;

        let userMsg = promptText;
        if (selectedImageBase64 && !promptText) {
            userMsg = "[Görsel yüklendi ve analiz edilerek hafızaya kaydediliyor...]";
        }

        addMessage("user", userMsg);
        inputField.value = "";

        const currentImage = selectedImageBase64;
        const currentImageType = selectedImageType;
        cancelImage(); // Önizlemeyi sıfırla

        addMessage("ai", "Düşünüyor ve analiz ediyor...");

        try {
            const memoryContext = JSON.stringify(getMemory());
            let contents = [];

            // Sistem Talimatı + Hafıza Bağlamı
            let systemInstruction = `Sen ŞükrüÖzolgay - AI Projects asistanısın. 
Kullanıcının kayıtlı hafızasındaki bilgiler şunlardır: ${memoryContext}. 
Kullanıcının sorularına cevap verirken önce hafızadaki bilgileri kontrol et. 
Eğer bir görsel yüklendiyse, görseldeki tüm metinleri, şemaları, grafikleri ve stratejileri detaylıca analiz et, özetle ve hafızaya kaydetmeye uygun şekilde açıkla.`;

            let userContentParts = [];
            
            if (currentImage) {
                userContentParts.push({
                    inline_data: {
                        mime_type: currentImageType,
                        data: currentImage
                    }
                });
                userContentParts.push({
                    text: promptText ? promptText : "Bu görseldeki tüm stratejileri, şemaları ve metinleri detaylıca incele, kavra ve bana tam bir özet çıkar."
                });
            } else {
                userContentParts.push({ text: promptText });
            }

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    system_instruction: { parts: [{ text: systemInstruction }] },
                    contents: [{ parts: userContentParts }]
                })
            });

            const data = await response.json();
            
            // AI Mesajını Güncelle
            const chatBox = document.getElementById("chatBox");
            chatBox.removeChild(chatBox.lastChild); // "Düşünüyor..." mesajını kaldır

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const aiReply = data.candidates[0].content.parts[0].text;
                addMessage("ai", aiReply);

                // Eğer görsel yüklendiyse bilgiyi otomatik hafızaya ekle
                if (currentImage) {
                    saveMemory({
                        date: new Date().toLocaleDateString('tr-TR'),
                        summary: aiReply
                    });
                }
            } else {
                addMessage("ai", "Bir hata oluştu veya yanıt alınamadı. API Key'inizi kontrol edin.");
            }

        } catch (error) {
            console.error(error);
            const chatBox = document.getElementById("chatBox");
            chatBox.removeChild(chatBox.lastChild);
            addMessage("ai", "Bağlantı hatası oluştu. Lütfen konsolu ve API Key'inizi kontrol edin.");
        }
    }

    // Sayfa açılışında hafıza sayısını güncelle
    updateMemoryCount();
</script>

</body>
</html>
