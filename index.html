<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ŞükrüÖzolgay - AI Projects</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --accent-color: #d81b60;
            --accent-hover: #b7154f;
            --text-main: #ffffff;
            --text-sub: #a0a0ab;
            --border-color: #2a2a32;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .layout-container {
            width: 100%;
            max-width: 1100px;
            height: 90vh;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* Sol Proje Paneli */
        .sidebar {
            width: 260px;
            background-color: #121215;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h3 {
            margin: 0;
            font-size: 0.95rem;
            color: var(--text-sub);
        }

        .btn-new-project {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .btn-new-project:hover {
            background-color: var(--accent-hover);
        }

        .project-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .project-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-sub);
            border: 1px solid transparent;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .project-item:hover {
            background-color: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
        }

        .project-item.active {
            background-color: rgba(216, 27, 96, 0.15);
            border-color: var(--accent-color);
            color: var(--text-main);
            font-weight: 600;
        }

        /* Sağ Chat Alanı */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--card-bg);
        }

        .header {
            padding: 16px 24px;
            background-color: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--accent-color);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .header-actions button {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .header-actions button:hover {
            color: var(--text-main);
            border-color: var(--accent-color);
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--accent-color);
            color: #fff;
        }

        .ai-message {
            align-self: flex-start;
            background-color: #222228;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .input-container {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            background-color: rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #0f0f12;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button.btn-send {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.btn-send:hover {
            background-color: var(--accent-hover);
        }

        .file-upload-btn {
            background-color: #222228;
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .file-upload-btn:hover {
            border-color: var(--accent-color);
            color: #fff;
        }

        #file-input {
            display: none;
        }

        .preview-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--accent-color);
        }

        .memory-badge {
            font-size: 0.8rem;
            color: var(--text-sub);
            background: #222228;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="layout-container">
    <!-- Sol Taraf: Projeler ve Sohbet Oturumları -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>Projeler</h3>
            <button class="btn-new-project" onclick="createNewProject()">+ Yeni Proje</button>
        </div>
        <div class="project-list" id="projectList">
            <!-- Dinamik Projeler Buraya Gelecek -->
        </div>
    </div>

    <!-- Sağ Taraf: Aktif Proje Sohbet Ekranı -->
    <div class="chat-main">
        <div class="header">
            <h2 id="activeProjectTitle">ŞükrüÖzolgay - AI Projects</h2>
            <div class="header-actions">
                <span class="memory-badge" id="memory-count">Global Hafıza: 0 Bilgi</span>
                <button onclick="setApiKey()">🔑 API Key Gir</button>
                <button onclick="clearGlobalMemory()">🗑️ Hafızayı Sıfırla</button>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message ai-message">Merhaba! Projelerinizi soldan seçebilir veya yeni bir proje açarak kaldığınız yerden devam edebilirsiniz. Yüklediğiniz görseller ve tüm aşamalar her zaman hatırlanır.</div>
        </div>

        <div class="input-container">
            <div class="preview-area" id="previewArea" style="display: none;">
                <span>📷 Seçilen Görsel: <strong id="fileName"></strong></span>
                <button onclick="cancelImage()" style="background:none; border:none; color:red; cursor:pointer;">✖</button>
            </div>
            <div class="input-row">
                <label class="file-upload-btn">
                    📁 Görsel Yükle
                    <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect(event)">
                </label>
                <input type="text" id="userInput" placeholder="Mesajınızı yazın veya projeyi kaldığı yerden yönlendirin..." onkeypress="handleKeyPress(event)">
                <button class="btn-send" onclick="sendMessage()">Gönder</button>
            </div>
        </div>
    </div>
</div>

<script>
    let selectedImageBase64 = null;
    let selectedImageType = null;

    // LocalStorage Tabanlı Veri Yönetimi
    function getApiKey() {
        return localStorage.getItem("gemini_api_key") || "";
    }

    function setApiKey() {
        const currentKey = getApiKey();
        const key = prompt("Google Gemini API Key giriniz:", currentKey);
        if (key !== null) {
            localStorage.setItem("gemini_api_key", key.trim());
            alert("API Key kaydedildi!");
        }
    }

    // Projeler ve Mesaj Geçmişi Veri Yapısı
    function getProjects() {
        let projects = JSON.parse(localStorage.getItem("sukru_ai_projects"));
        if (!projects) {
            projects = {
                "Varsayılan Proje": []
            };
            localStorage.setItem("sukru_ai_projects", JSON.stringify(projects));
        }
        return projects;
    }

    function saveProjects(projects) {
        localStorage.setItem("sukru_ai_projects", JSON.stringify(projects));
    }

    function getActiveProject() {
        return localStorage.getItem("sukru_active_project") || "Varsayılan Proje";
    }

    function setActiveProject(projectName) {
        localStorage.setItem("sukru_active_project", projectName);
        renderProjectsList();
        loadChatHistory();
    }

    function getGlobalMemory() {
        return JSON.parse(localStorage.getItem("sukru_global_knowledge")) || [];
    }

    function saveGlobalMemory(data) {
        const memory = getGlobalMemory();
        memory.push(data);
        localStorage.setItem("sukru_global_knowledge", JSON.stringify(memory));
        updateMemoryCount();
    }

    function clearGlobalMemory() {
        if(confirm("Tüm ortak hafıza silinecek. Emin misiniz?")) {
            localStorage.removeItem("sukru_global_knowledge");
            updateMemoryCount();
            alert("Global hafıza sıfırlandı.");
        }
    }

    function updateMemoryCount() {
        const count = getGlobalMemory().length;
        document.getElementById("memory-count").innerText = `Global Hafıza: ${count} Bilgi`;
    }

    // Arayüz Çizimleri
    function renderProjectsList() {
        const projects = getProjects();
        const activeProj = getActiveProject();
        const listContainer = document.getElementById("projectList");
        listContainer.innerHTML = "";

        for (const projName in projects) {
            const item = document.createElement("div");
            item.className = `project-item ${projName === activeProj ? 'active' : ''}`;
            item.innerHTML = `<span>📁 ${projName}</span>`;
            item.onclick = () => setActiveProject(projName);
            listContainer.appendChild(item);
        }

        document.getElementById("activeProjectTitle").innerText = `Proje: ${activeProj}`;
    }

    function loadChatHistory() {
        const projects = getProjects();
        const activeProj = getActiveProject();
        const chatBox = document.getElementById("chatBox");
        chatBox.innerHTML = "";

        const history = projects[activeProj] || [];
        if (history.length === 0) {
            addMessageToDOM("ai", `"${activeProj}" projesine hoş geldiniz! Buradan kaldığınız yerden devam edebilir veya yeni talimatlar verebilirsiniz.`);
        } else {
            history.forEach(msg => {
                addMessageToDOM(msg.sender, msg.text);
            });
        }
    }

    function createNewProject() {
        const projName = prompt("Yeni proje adını giriniz (Örn: E-Ticaret Lansmanı):");
        if (!projName) return;

        const projects = getProjects();
        if (projects[projName]) {
            alert("Bu isimde bir proje zaten var!");
            return;
        }

        projects[projName] = [];
        saveProjects(projects);
        setActiveProject(projName);
    }

    // Görsel İşlemleri
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        selectedImageType = file.type;
        const reader = new FileReader();
        reader.onload = function(e) {
            selectedImageBase64 = e.target.result.split(',')[1];
            document.getElementById("fileName").innerText = file.name;
            document.getElementById("previewArea").style.display = "flex";
        };
        reader.readAsDataURL(file);
    }

    function cancelImage() {
        selectedImageBase64 = null;
        selectedImageType = null;
        document.getElementById("file-input").value = "";
        document.getElementById("previewArea").style.display = "none";
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }

    function addMessageToDOM(sender, text) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender === 'user' ? 'user-message' : 'ai-message'}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function saveMessageToActiveProject(sender, text) {
        const projects = getProjects();
        const activeProj = getActiveProject();
        if (!projects[activeProj]) projects[activeProj] = [];
        
        projects[activeProj].push({ sender, text });
        saveProjects(projects);
    }

    // Mesaj Gönderme ve Yapay Zeka Entegrasyonu
    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const promptText = inputField.value.trim();
        const apiKey = getApiKey();

        if (!apiKey) {
            alert("Lütfen önce 'API Key Gir' butonuna tıklayarak Gemini API Key'inizi tanımlayın!");
            return;
        }

        if (!promptText && !selectedImageBase64) return;

        let userMsg = promptText;
        if (selectedImageBase64 && !promptText) {
            userMsg = "[Görsel yüklendi ve projenin ortak hafızasına işleniyor...]";
        }

        // DOM ve Hafızaya Kaydet
        addMessageToDOM("user", userMsg);
        saveMessageToActiveProject("user", userMsg);
        inputField.value = "";

        const currentImage = selectedImageBase64;
        const currentImageType = selectedImageType;
        cancelImage();

        addMessageToDOM("ai", "Proje geçmişi ve global hafıza taranıyor...");

        try {
            const activeProj = getActiveProject();
            const projects = getProjects();
            const currentProjectHistory = JSON.stringify(projects[activeProj]);
            const globalMemoryContext = JSON.stringify(getGlobalMemory());

            let systemInstruction = `Sen ŞükrüÖzolgay - AI Projects sisteminin gelişmiş proje asistanısın. 
Aktif Proje Adı: "${activeProj}"
Bu Projenin Geçmiş Sohbetleri: ${currentProjectHistory}
Tüm Projelerin Ortak (Global) Hafızası ve Yüklenen Strateji Görselleri: ${globalMemoryContext}

Kullanıcı hangi sohbet ekranında olursa olsun, bu projenin tüm geçmiş aşamalarını, yüklenen dokümanları ve global hafızayı eksiksiz hatırlayarak kaldığı yerden stratejik ve kesintisiz yanıtlar üret.`;

            let userContentParts = [];
            
            if (currentImage) {
                userContentParts.push({
                    inline_data: {
                        mime_type: currentImageType,
                        data: currentImage
                    }
                });
                userContentParts.push({
                    text: promptText ? promptText : "Bu görseldeki stratejileri analiz et, projeye entegre et ve özetle."
                });
            } else {
                userContentParts.push({ text: promptText });
            }

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    system_instruction: { parts: [{ text: systemInstruction }] },
                    contents: [{ parts: userContentParts }]
                })
            });

            const data = await response.json();
            
            // "Yükleniyor..." mesajını kaldır
            const chatBox = document.getElementById("chatBox");
            chatBox.removeChild(chatBox.lastChild);

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const aiReply = data.candidates[0].content.parts[0].text;
                addMessageToDOM("ai", aiReply);
                saveMessageToActiveProject("ai", aiReply);

                // Görsel yüklendiyse global hafızaya da işle
                if (currentImage) {
                    saveGlobalMemory({
                        project: activeProj,
                        date: new Date().toLocaleDateString('tr-TR'),
                        summary: aiReply
                    });
                }
            } else {
                addMessageToDOM("ai", "Bir hata oluştu. API Key'inizi kontrol edin.");
            }

        } catch (error) {
            console.error(error);
            const chatBox = document.getElementById("chatBox");
            chatBox.removeChild(chatBox.lastChild);
            addMessaageToDOM("ai", "Bağlantı hatası oluştu.");
        }
    }

    // İlk Yükleme
    renderProjectsList();
    loadChatHistory();
    updateMemoryCount();
</script>

</body>
</html>
