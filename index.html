<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUKRUOZOLGAY-AI-FACTORY</title>
    <style>
        :root {
            --bg-color: #0d0d0f;
            --container-bg: #141417;
            --border-color: #26262c;
            --accent-orange: #ff7a00;
            --text-main: #f0f0f3;
            --text-muted: #8e8e99;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .main-frame { width: 100%; max-width: 1150px; background-color: var(--container-bg); border: 2px solid var(--border-color); border-radius: 28px; padding: 24px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7); }
        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .brand-logo { font-weight: 800; font-size: 0.95rem; border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 14px; background: rgba(255,255,255,0.02); color: var(--accent-orange); }
        .nav-actions { display: flex; gap: 12px; }
        .contact-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 14px; color: var(--text-main); padding: 10px 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
        .workspace { display: grid; grid-template-columns: 1.4fr 0.9fr; gap: 20px; background: #09090b; border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; }
        .hero-content { display: flex; flex-direction: column; justify-content: space-between; }
        .hero-title { font-size: 1.8rem; font-weight: 800; text-transform: uppercase; margin-bottom: 12px; }
        .hero-title span { color: var(--accent-orange); }
        .chat-box { background: rgba(20, 20, 23, 0.9); border: 1px solid var(--border-color); border-radius: 14px; height: 220px; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        .message { font-size: 0.85rem; padding: 10px 14px; border-radius: 12px; max-width: 90%; line-height: 1.4; word-break: break-word; }
        .message.ai { background: rgba(255, 122, 0, 0.1); border: 1px solid rgba(255, 122, 0, 0.2); align-self: flex-start; }
        .message.user { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); align-self: flex-end; }
        .chat-terminal { background: rgba(20, 20, 23, 0.7); border: 1px solid var(--border-color); border-radius: 14px; padding: 8px 12px; display: flex; gap: 8px; }
        .chat-terminal input { flex: 1; background: transparent; border: none; color: var(--text-main); outline: none; font-size: 0.9rem; }
        .chat-terminal button { background: var(--accent-orange); border: none; color: #fff; padding: 8px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .side-visual-panel { display: flex; flex-direction: column; gap: 16px; justify-content: space-between; align-items: flex-end; }
        .action-pill { background: #fff; color: #000; font-weight: 700; padding: 10px 20px; border-radius: 30px; font-size: 0.85rem; }
        .card-preview { background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: 16px; padding: 12px; width: 100%; max-width: 240px; }
        .card-info { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-top: 8px; }
        .card-info b { color: var(--text-main); }
    </style>
</head>
<body>
    <script>
        // Sadece senin bildiğin özel şifre (İstediğin zaman değiştirebilirsin)
        const GIZLI_SIFRE = "sukru-2026";
        let girisYapildi = sessionStorage.getItem('ai_auth') === 'true';
        if (!girisYapildi) {
            let sifre = prompt("SUKRUOZOLGAY-AI-FACTORY: Özel Şifreyi Girin:");
            if (sifre === GIZLI_SIFRE) {
                sessionStorage.setItem('ai_auth', 'true');
            } else {
                alert("Yetkisiz erişim! Bu sistem sadece Şükrü Özolgay'a özeldir.");
                document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20vh;'>ERİŞİM ENGELLENDİ</h1>";
                throw new Error("Durduruldu");
            }
        }
    </script>
    <div class="main-frame">
        <div class="header-nav">
            <div class="brand-logo">SUKRUOZOLGAY // PRIVATE AI FACTORY</div>
            <div class="nav-actions">
                <button class="contact-btn"><span>●</span> Gizli Mod Aktif</button>
            </div>
        </div>
        <div class="workspace">
            <div class="hero-content">
                <div>
                    <h1 class="hero-title">SÜPER BEYİN <br><span>ÖZEL FABRİKA</span></h1>
                </div>
                <div>
                    <div class="chat-box" id="chatBox">
                        <div class="message ai">Hoş geldin Şükrü! Sistem tamamen gizli (Private) ve şifreli olarak aktif edildi.</div>
                    </div>
                    <div class="chat-terminal">
                        <input type="text" id="userInput" placeholder="Komutunu yaz...">
                        <button id="sendBtn">Çalıştır</button>
                    </div>
                </div>
            </div>
            <div class="side-visual-panel">
                <div class="action-pill">SIFIR MALİYET</div>
                <div class="card-preview">
                    <div style="background:#1a1a1f; height:110px; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--accent-orange); font-weight:bold; gap:6px;">
                        <span>KOTA KORUMASI</span>
                        <span id="limitStatus" style="font-size: 0.75rem; color: #4ade80;">Aktif / 0 Maliyet</span>
                    </div>
                    <div class="card-info">
                        <span>Günlük Limit</span>
                        <b>50 İşlem</b>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const GUNLUK_LIMIT = 50;
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function kilitKontrolu() {
            const bugun = new Date().toLocaleDateString();
            const kayitliTarih = localStorage.getItem('limit_tarihi');
            let kullanim = parseInt(localStorage.getItem('gunluk_kullanim') || "0");
            if (kayitliTarih !== bugun) {
                localStorage.setItem('limit_tarihi', bugun);
                localStorage.setItem('gunluk_kullanim', "0");
                kullanim = 0;
            }
            if (kullanim >= GUNLUK_LIMIT) {
                userInput.disabled = true;
                sendBtn.disabled = true;
                userInput.placeholder = "Günlük ücretsiz limit doldu!";
                return false;
            }
            return true;
        }

        function addMessage(text, sender) {
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            msg.textContent = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.addEventListener('click', () => {
            if (!kilitKontrolu()) return;
            const txt = userInput.value.trim();
            if (!txt) return;
            addMessage(txt, 'user');
            userInput.value = '';

            let mevcut = parseInt(localStorage.getItem('gunluk_kullanim') || "0");
            localStorage.setItem('gunluk_kullanim', mevcut + 1);

            setTimeout(() => {
                addMessage(`[ÖZEL BEYİN]: "${txt}" analizi tamamlandı. Sıfır maliyetli motor aktif. Kalan hak: ${GUNLUK_LIMIT - (mevcut + 1)}`, 'ai');
            }, 500);
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });

        kilitKontrolu();
    </script>
</body>
</html>
