<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kişisel AI Studio - Hugging Face Edition</title>
  <style>
    :root {
      --primary-color: #ffd21e;
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --msg-user: #fef08a;
      --msg-ai: #f1f5f9;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --msg-user: #854d0e;
      --msg-ai: #334155;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      height: 90vh;
      overflow: hidden;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand { font-size: 1.2rem; font-weight: 700; color: #d97706; }
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    select, button {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.875rem;
      cursor: pointer;
    }

    .reset-btn { background-color: #ef4444 !important; color: white !important; border: none !important; }

    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .message.user { align-self: flex-end; background-color: var(--msg-user); border-bottom-right-radius: 2px; }
    .message.ai { align-self: flex-start; background-color: var(--msg-ai); border-bottom-left-radius: 2px; }
    .message.error { align-self: flex-start; background-color: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }

    .message-meta { font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; color: var(--text-muted); }

    .input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
    }

    #user-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-main);
      font-size: 0.95rem;
    }

    #send-btn { background-color: #d97706; color: white; border: none; font-weight: 600; padding: 0 20px; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand">🤗 HF AI Studio</div>
      
      <div class="toolbar">
        <select id="model-select">
          <option value="Qwen/Qwen2.5-72B-Instruct">Qwen 2.5 72B (Çok Güçlü)</option>
          <option value="Qwen/Qwen2.5-7B-Instruct">Qwen 2.5 7B (Hızlı)</option>
          <option value="meta-llama/Llama-3.1-8B-Instruct">Llama 3.1 8B</option>
          <option value="deepseek-ai/DeepSeek-R1-Distill-Qwen-32B">DeepSeek R1 32B</option>
        </select>

        <button id="reset-keys-btn" class="reset-btn">🔑 HF Key Sıfırla</button>
        <button id="theme-toggle">🌙 Gece</button>
      </div>
    </header>

    <div id="chat-box"></div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="Bir şeyler yazın..." />
      <button id="send-btn">Gönder</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const chatBox = document.getElementById("chat-box");
      const userInput = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const modelSelect = document.getElementById("model-select");
      const themeToggle = document.getElementById("theme-toggle");
      const resetKeysBtn = document.getElementById("reset-keys-btn");

      resetKeysBtn.addEventListener("click", () => {
        localStorage.removeItem("MY_HF_KEY");
        alert("Hugging Face API anahtarı silindi. Sayfayı yenileyip yeni anahtarı girebilirsiniz.");
      });

      const savedTheme = localStorage.getItem("APP_THEME") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
      themeToggle.textContent = savedTheme === "dark" ? "☀️ Gündüz" : "🌙 Gece";

      themeToggle.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("APP_THEME", newTheme);
        themeToggle.textContent = newTheme === "dark" ? "☀️ Gündüz" : "🌙 Gece";
      });

      function getApiKey() {
        let key = localStorage.getItem("MY_HF_KEY");
        if (!key) {
          key = prompt("Hugging Face Access Token girin (hf_...):");
          if (key && key.trim() !== "") {
            key = key.trim();
            localStorage.setItem("MY_HF_KEY", key);
          } else {
            alert("API anahtarı girilmedi.");
            return null;
          }
        }
        return key;
      }

      async function handleSendMessage() {
        const promptText = userInput.value.trim();
        if (!promptText) return;

        const apiKey = getApiKey();
        if (!apiKey) return;

        const modelName = modelSelect.value;
        const apiUrl = `https://api-inference.huggingface.co/models/${modelName}/v1/chat/completions`;

        appendMessage("Sen", promptText, "user");
        userInput.value = "";
        
        const loadingId = appendMessage("Yapay Zeka", "Hugging Face yanıtlıyor...", "ai");

        const systemPrompt = "Bugünün tarihi 7 Eylül 2026. Kullanıcıya Türkçe olarak yanıt ver.";

        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${apiKey}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: modelName,
              messages: [
                { role: "system", content: systemPrompt },
                { role: "user", content: promptText }
              ],
              max_tokens: 1000
            })
          });

          removeMessage(loadingId);

          if (!response.ok) {
            let errText = `Hata Kodu: ${response.status}`;
            if (response.status === 401) {
              localStorage.removeItem("MY_HF_KEY");
              errText += " - Geçersiz veya eksik Token! (Key silindi, yenileyip tekrar girin)";
            } else if (response.status === 503) {
              errText += " - Model şu an yükleniyor, lütfen 10 saniye sonra tekrar deneyin.";
            }
            throw new Error(errText);
          }

          const data = await response.json();
          const reply = data.choices[0].message.content;
          const label = modelSelect.options[modelSelect.selectedIndex].text;
          appendMessage(label, reply, "ai");

        } catch (error) {
          removeMessage(loadingId);
          console.error("Hata:", error);
          appendMessage("Sistem Hatası", error.message, "error");
        }
      }

      function appendMessage(sender, text, type) {
        const msgDiv = document.createElement("div");
        const msgId = "msg-" + Date.now();
        msgDiv.id = msgId;
        msgDiv.classList.add("message", type);
        
        msgDiv.innerHTML = `
          <div class="message-meta">${sender}</div>
          <div>${String(text).replace(/\n/g, '<br>')}</div>
        `;
        
        chatBox.appendChild(msgDiv);
        setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 50);
        return msgId;
      }

      function removeMessage(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
      }

      sendBtn.addEventListener("click", handleSendMessage);
      userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") handleSendMessage();
      });
    });
  </script>
</body>
</html>
