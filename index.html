<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şükrü Özolgay - AI Factory</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #000000; color: #f8fafc; min-height: 100vh; }
        
        /* Şifre Giriş Ekranı */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .auth-card {
            background: #000000; padding: 40px; border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(202, 31, 61, 0.2); width: 100%; max-width: 400px;
            text-align: center; border: 1px solid #CA1F3D;
        }
        .auth-card h2 { margin-bottom: 8px; color: #CA1F3D; font-size: 24px; }
        .auth-card p { margin-bottom: 24px; color: #a1a1aa; font-size: 14px; }
        .auth-input {
            width: 100%; padding: 12px 16px; background: #000000; border: 1px solid #CA1F3D;
            border-radius: 8px; color: white; font-size: 16px; margin-bottom: 16px; outline: none;
        }
        .auth-btn {
            width: 100%; padding: 12px; background: #CA1F3D; color: white; border: none;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: background 0.2s;
        }
        .auth-btn:hover { background: #a51831; }
        .error-msg { color: #f87171; font-size: 13px; margin-top: 10px; display: none; }

        /* Ana Panel Arayüzü */
        #main-content { display: none; width: 100%; min-height: 100vh; padding: 30px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1a1a; padding-bottom: 20px; margin-bottom: 30px; }
        header h1 { color: #CA1F3D; font-size: 22px; }
        .logout-btn { background: #CA1F3D; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .logout-btn:hover { background: #a51831; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #000000; border: 1px solid #1a1a1a; border-radius: 12px; padding: 24px; transition: transform 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .card:hover { transform: translateY(-3px); border-color: #CA1F3D; }
        .card h3 { color: #CA1F3D; margin-bottom: 10px; }
        .card p { color: #a1a1aa; font-size: 14px; margin-bottom: 20px; }
        .card-btn { background: #CA1F3D; color: white; border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; text-decoration: none; text-align: center; display: inline-block; }
        .card-btn:hover { background: #a51831; }

        /* Sohbet Ekranı (Chat Modal) */
        #chat-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 10000; align-items: center; justify-content: center;
        }
        .chat-container {
            background: #000000; width: 90%; max-width: 600px; height: 80vh; border-radius: 16px;
            border: 1px solid #CA1F3D; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(202, 31, 61, 0.3);
        }
        .chat-header {
            background: #000000; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #1a1a1a;
        }
        .chat-header h3 { color: #CA1F3D; font-size: 18px; }
        .close-chat { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
        .message.user { background: #CA1F3D; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.ai { background: #000000; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #1a1a1a; }
        .chat-input-area { padding: 15px; background: #000000; border-top: 1px solid #1a1a1a; display: flex; gap: 10px; }
        .chat-input { flex: 1; padding: 10px 14px; background: #000000; border: 1px solid #1a1a1a; border-radius: 8px; color: white; outline: none; }
        .chat-input:focus { border-color: #CA1F3D; }
        .send-btn { background: #CA1F3D; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .send-btn:hover { background: #a51831; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>AI Factory</h2>
            <p>Bu sistem sadece Şükrü Özolgay'a özeldir.</p>
            <input type="password" id="password-input" class="auth-input" placeholder="Özel Şifreyi Girin" onkeypress="handleKeyPress(event)">
            <button class="auth-btn" onclick="checkPassword()">Giriş Yap</button>
            <div id="error" class="error-msg">Hatalı Şifre! Lütfen tekrar deneyin.</div>
        </div>
    </div>

    <div id="main-content">
        <header>
            <h1>Şükrü Özolgay - AI Factory Kontrol Paneli</h1>
            <button class="logout-btn" onclick="logout()">Çıkış Yap</button>
        </header>

        <div class="dashboard-grid">
            <div class="card">
                <div>
                    <h3>AI Sohbet
