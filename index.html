<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kişisel AI Studio</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --msg-user: #dbeafe;
      --msg-ai: #f1f5f9;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    [data-theme="dark"] {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --msg-user: #1e3a8a;
      --msg-ai: #334155;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; transition: background-color 0.2s, color 0.2s, border-color 0.2s; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      height: 90vh;
      overflow: hidden;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    select, button, input[type="color"] {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.875rem;
      cursor: pointer;
      outline: none;
    }

    .reset-btn {
      background-color: #ef4444 !important;
      color: white !important;
      border: none !important;
    }

    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--msg-user);
      border-bottom-right-radius: 2px;
    }

    .message.ai {
      align-self: flex-start;
      background-color: var(--msg-ai);
      border-bottom-left-radius: 2px;
    }

    .message.error {
      align-self: center;
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .message-meta {
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    .input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
    }

    #user-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-main);
      font-size: 0.95rem;
    }

    #send-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      font-weight: 600;
      padding: 0 20px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand">⚡ AI Studio</div>
      
      <div class="toolbar">
        <select id="model-select">
          <optgroup label="Groq (Tamamen Ücretsiz / Hızlı)">
            <option value="groq-flash">Groq Flash (Llama 8B Instant)</option>
            <option value="groq-pro">Groq Pro (Llama 70B Versatile)</option>
            <option value="groq-extended">Groq Extended (DeepSeek R1 Distill)</option>
          </optgroup>
          <optgroup label="OpenRouter (Ücretsiz)">
            <option value="qwen-flash">Qwen Flash (2.5 7B)</option>
            <option value="qwen-pro">Qwen Pro (2.5 72B)</option>
          </optgroup>
        </select>

        <button id="reset-keys-btn" class="reset-btn" title="Kayıtlı API Anahtarlarını Sil">🔑 Key Sıfırla</button>
        <input type="color" id="primary-color-picker" value="#2563eb">
        <button class="theme-btn" id="theme-toggle">🌙 Gece</button>
      </div>
    </header>

    <div id="chat-box"></div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="Bir şeyler yazın..." />
      <button id="send-btn">Gönder</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const chatBox = document.getElementById("chat-box");
      const userInput = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const modelSelect = document.getElementById("model-select");
      const themeToggle = document.getElementById("theme-toggle");
      const colorPicker = document.getElementById("primary-color-picker");
      const resetKeysBtn = document.getElementById("reset-keys-btn");

      resetKeysBtn.addEventListener("click", () => {
        localStorage.removeItem("MY_GROQ_KEY");
        localStorage.removeItem("MY_OPENROUTER_KEY");
        alert("Kayıtlı tüm API anahtarları silindi. Yeni istek attığınızda tekrar sorulacak.");
      });

      const savedTheme = localStorage.getItem("APP_THEME") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
      themeToggle.textContent = savedTheme === "dark" ? "☀️ Gündüz" : "🌙 Gece";

      themeToggle.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("APP_THEME", newTheme);
        themeToggle.textContent = newTheme === "dark" ? "☀️ Gündüz" : "🌙 Gece";
      });

      const savedColor = localStorage.getItem("APP_COLOR") || "#2563eb";
      document.documentElement.style.setProperty("--primary-color", savedColor);
      colorPicker.value = savedColor;

      colorPicker.addEventListener("input", (e) => {
        document.documentElement.style.setProperty("--primary-color", e.target.value);
        localStorage.setItem("APP_COLOR", e.target.value);
      });

      function getApiKey(keyName, promptText) {
        let key = localStorage.getItem(keyName);
        if (!key) {
          key = prompt(promptText);
          if (key && key.trim() !== "") {
            localStorage.setItem(keyName, key.trim());
          } else {
            alert("API anahtarı girmediniz.");
            return null;
          }
        }
        return key;
      }

      async function handleSendMessage() {
        const promptText = userInput.value.trim();
        if (!promptText) return;

        const selectedMode = modelSelect.value;
        let apiUrl = "";
        let apiKey = "";
        let modelName = "";
        let headers = { "Content-Type": "application/json" };

        if (selectedMode.startsWith("groq")) {
          apiKey = getApiKey("MY_GROQ_KEY", "Groq API Anahtarınızı girin (console.groq.com):");
          apiUrl = "https://api.groq.com/openai/v1/chat/completions";

          if (selectedMode === "groq-flash") modelName = "llama-3.1-8b-instant";
          else if (selectedMode === "groq-pro") modelName = "llama-3.1-70b-versatile";
          else if (selectedMode === "groq-extended") modelName = "deepseek-r1-distill-llama-70b";

        } else if (selectedMode.startsWith("qwen")) {
          apiKey = getApiKey("MY_OPENROUTER_KEY", "OpenRouter API Anahtarınızı girin:");
          apiUrl = "https://openrouter.ai/api/v1/chat/completions";
          headers["HTTP-Referer"] = window.location.origin;
          headers["X-Title"] = "Personal AI Studio";

          if (selectedMode === "qwen-flash") modelName = "qwen/qwen-2.5-7b-instruct:free";
          else if (selectedMode === "qwen-pro") modelName = "qwen/qwen-2.5-72b-instruct:free";
        }

        if (!apiKey) return;
        headers["Authorization"] = `Bearer ${apiKey}`;

        appendMessage("Sen", promptText, "user");
        userInput.value = "";
        
        const loadingId = appendMessage("Yapay Zeka", "Düşünüyor...", "ai");

        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: headers,
            body: JSON.stringify({
              model: modelName,
              messages: [{ role: "user", content: promptText }]
            })
          });

          if (!response.ok) {
            let errorDetails = `Hata Kodu: ${response.status}`;
            try {
              const errJson = await response.json();
              if (errJson.error && errJson.error.message) {
                errorDetails += ` - ${errJson.error.message}`;
              }
            } catch (e) {}

            if (response.status === 401) {
              const keyToRemove = selectedMode.startsWith("groq") ? "MY_GROQ_KEY" : "MY_OPENROUTER_KEY";
              localStorage.removeItem(keyToRemove);
              errorDetails += " (Hatalı Key silindi, tekrar deneyin)";
            }
            throw new Error(errorDetails);
          }

          const data = await response.json();
          removeMessage(loadingId);
          
          const label = modelSelect.options[modelSelect.selectedIndex].text;
          appendMessage(label, data.choices[0].message.content, "ai");

        } catch (error) {
          console.error(error);
          removeMessage(loadingId);
          appendMessage("Sistem Hata", error.message || "Bağlantı kurulamadı.", "error");
        }
      }

      function appendMessage(sender, text, type) {
        const msgDiv = document.createElement("div");
        const msgId = "msg-" + Date.now();
        msgDiv.id = msgId;
        msgDiv.classList.add("message", type);
        
        msgDiv.innerHTML = `
          <div class="message-meta">${sender}</div>
          <div>${text.replace(/\n/g, '<br>')}</div>
        `;
        
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return messageId;
      }

      function removeMessage(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
      }

      sendBtn.addEventListener("click", handleSendMessage);
      userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") handleSendMessage();
      });
    });
  </script>
</body>
</html>
