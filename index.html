<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kişisel AI Asistanı</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 30px auto;
      padding: 0 15px;
      background-color: #f4f6f8;
    }
    h2 {
      color: #333;
      text-align: center;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #fff;
    }
    #chat-box {
      border: 1px solid #ddd;
      height: 450px;
      overflow-y: auto;
      padding: 15px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 15px;
    }
    .input-container {
      display: flex;
      gap: 10px;
    }
    #user-input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }
    #send-button {
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }
    #send-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h2>Kişisel AI Asistanı</h2>
  
  <div class="controls">
    <label for="provider-select"><strong>Model Seçimi:</strong></label>
    <select id="provider-select">
      <option value="qwen-online">Qwen 72B (OpenRouter + Canlı Web Arama)</option>
      <option value="qwen-standard">Qwen 72B (OpenRouter - Standart)</option>
      <option value="groq-llama">Groq (Llama 3 - Işık Hızında)</option>
    </select>
  </div>

  <div id="chat-box"></div>
  
  <div class="input-container">
    <input type="text" id="user-input" placeholder="Mesajınızı yazın..." />
    <button id="send-button">Gönder</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sendButton = document.getElementById("send-button");
      const userInput = document.getElementById("user-input");
      const chatBox = document.getElementById("chat-box");
      const providerSelect = document.getElementById("provider-select");

      function getApiKey(keyName, promptText) {
        let key = localStorage.getItem(keyName);
        if (!key) {
          key = prompt(promptText);
          if (key && key.trim() !== "") {
            localStorage.setItem(keyName, key.trim());
          } else {
            alert("API anahtarı girilmedi.");
            return null;
          }
        }
        return key;
      }

      async function handleSendMessage() {
        const promptText = userInput.value.trim();
        if (!promptText) return;

        const selectedMode = providerSelect.value;
        let apiUrl = "";
        let apiKey = "";
        let modelName = "";

        if (selectedMode.startsWith("qwen")) {
          apiKey = getApiKey("MY_OPENROUTER_KEY", "Lütfen OpenRouter API Anahtarınızı girin:");
          apiUrl = "https://openrouter.ai/api/v1/chat/completions";
          // Web araması aktif mod için :online eki kullanılır
          modelName = selectedMode === "qwen-online" ? "qwen/qwen-2.5-72b-instruct:online" : "qwen/qwen-2.5-72b-instruct";
        } else if (selectedMode === "groq-llama") {
          apiKey = getApiKey("MY_GROQ_KEY", "Lütfen Groq API Anahtarınızı girin (console.groq.com):");
          apiUrl = "https://api.groq.com/openai/v1/chat/completions";
          modelName = "llama-3.3-70b-versatile";
        }

        if (!apiKey) return;

        appendMessage("Sen", promptText);
        userInput.value = "";
        
        const loadingId = appendMessage("AI", "Düşünüyor...", true);

        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${apiKey}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: modelName,
              messages: [{ role: "user", content: promptText }]
            })
          });

          if (!response.ok) {
            if (response.status === 401) {
              const keyToRemove = selectedMode.startsWith("qwen") ? "MY_OPENROUTER_KEY" : "MY_GROQ_KEY";
              localStorage.removeItem(keyToRemove);
              throw new Error("API Anahtarı geçersiz. Sıfırlandı, tekrar deneyin.");
            }
            throw new Error(`Sunucu Hatası: ${response.status}`);
          }

          const data = await response.json();
          removeMessage(loadingId);
          
          const botName = selectedMode.includes("groq") ? "Groq AI" : "Qwen AI";
          appendMessage(botName, data.choices[0].message.content);

        } catch (error) {
          console.error(error);
          removeMessage(loadingId);
          appendMessage("Sistem Hata", error.message || "Bağlantı kurulamadı.");
        }
      }

      function appendMessage(sender, text, isLoading = false) {
        if (!chatBox) return;
        const messageDiv = document.createElement("div");
        const messageId = "msg-" + Date.now();
        messageDiv.id = messageId;
        messageDiv.style.margin = "10px 0";
        messageDiv.style.padding = "10px 14px";
        messageDiv.style.borderRadius = "6px";
        messageDiv.style.backgroundColor = sender === "Sen" ? "#e3f2fd" : "#f1f3f4";
        
        messageDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return messageId;
      }

      function removeMessage(id) {
        const element = document.getElementById(id);
        if (element) element.remove();
      }

      if (sendButton && userInput) {
        sendButton.addEventListener("click", handleSendMessage);
        userInput.addEventListener("keypress", (e) => {
          if (e.key === "Enter") handleSendMessage();
        });
      }
    });
  </script>
</body>
</html>
