<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şükrü Özolgay - AI Factory</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        /* Giriş Ekranı Tasarımı */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        .auth-card {
            background: #1e293b; padding: 40px; border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); width: 100%; max-width: 400px;
            text-align: center; border: 1px solid #334155;
        }
        .auth-card h2 { margin-bottom: 8px; color: #38bdf8; font-size: 24px; }
        .auth-card p { margin-bottom: 24px; color: #94a3b8; font-size: 14px; }
        .auth-input {
            width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #475569;
            border-radius: 8px; color: white; font-size: 16px; margin-bottom: 16px; outline: none;
            transition: border-color 0.2s;
        }
        .auth-input:focus { border-color: #38bdf8; }
        .auth-btn {
            width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: background 0.2s;
        }
        .auth-btn:hover { background: #7dd3fc; }
        .error-msg { color: #f87171; font-size: 13px; margin-top: 10px; display: none; }

        /* Ana İçerik (Giriş Yapılınca Görünecek) */
        #main-content { display: none; width: 100%; height: 100vh; padding: 40px; text-align: center; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>AI Factory</h2>
            <p>Bu sistem sadece Şükrü Özolgay'a özeldir.</p>
            <input type="password" id="password-input" class="auth-input" placeholder="Özel Şifreyi Girin">
            <button class="auth-btn" onclick="checkPassword()">Giriş Yap</button>
            <div id="error" class="error-msg">Hatalı Şifre! Lütfen tekrar deneyin.</div>
        </div>
    </div>

    <div id="main-content">
        <h1>Hoş Geldin, Şükrü Özolgay!</h1>
        <p>Sistem başarıyla açıldı ve koruma aktif.</p>
    </div>

    <script>
        // Sayfa açıldığında daha önce giriş yapıldı mı kontrol et
        window.onload = function() {
            if (localStorage.getItem("isLoggedIn") === "true") {
                document.getElementById("auth-overlay").style.display = "none";
                document.getElementById("main-content").style.display = "block";
            }
        };

        function checkPassword() {
            const inputVal = document.getElementById("password-input").value;
            const correctPassword = "Sso35-35sso"; // Belirlediğimiz şifre

            if (inputVal === correctPassword) {
                localStorage.setItem("isLoggedIn", "true");
                document.getElementById("auth-overlay").style.display = "none";
                document.getElementById("main-content").style.display = "block";
            } else {
                document.getElementById("error").style.display = "block";
                document.getElementById("password-input").value = "";
            }
        }
    </script>
</body>
</html>
